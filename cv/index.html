<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>页面已迁移 · 权贵杰个人主页</title>
<meta http-equiv="refresh" content="1;url=https://guijiequan-spec.github.io/">
<link rel="canonical" href="https://guijiequan-spec.github.io/">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0B1220 0%,#16233A 60%,#0B1220 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#E8EDF5;padding:24px;
  }
  .box{text-align:center;max-width:520px}
  .logo{
    width:64px;height:64px;border-radius:14px;margin:0 auto 22px;
    background:#E8541F;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;color:#fff;box-shadow:0 8px 26px rgba(232,84,31,.35);
  }
  h1{font-size:22px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
  p{font-size:14px;line-height:1.9;color:#9AA9BF;margin-bottom:26px}
  a.btn{
    display:inline-block;padding:12px 30px;border-radius:8px;
    background:#E8541F;color:#fff;text-decoration:none;font-size:15px;font-weight:600;
    transition:transform .18s,box-shadow .18s;box-shadow:0 6px 20px rgba(232,84,31,.3);
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(232,84,31,.45)}
  .url{margin-top:20px;font-size:12px;color:#6B7C93;word-break:break-all}
  .spin{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.22);border-top-color:#E8541F;
    border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">权</div>
  <h1>个人主页已迁移到新地址</h1>
  <p><span class="spin"></span>正在自动跳转，若未跳转请点击下面的按钮</p>
  <a class="btn" href="https://guijiequan-spec.github.io/">前往 guijiequan-spec.github.io</a>
  <div class="url">新地址：https://guijiequan-spec.github.io/</div>
</div>
<script>setTimeout(function(){location.replace('https://guijiequan-spec.github.io/');},1000);</script>
</body>
</html>
