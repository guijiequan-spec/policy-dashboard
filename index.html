<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政策动态看板 · 中国宏观经济与人力资源政策监测</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D97706'/%3E%3Cpath d='M9 8h11l4 4v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Cpath d='M11 15h10M11 19h10M11 22h6' stroke='%23D97706' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --line:#E3E7EB; --line-soft:#EFF1F4;
  --t1:#151A20; --t2:#4B5563; --t3:#8A94A2;
  --accent:#D97706; --accent-soft:#FEF6E7; --accent-line:#F3D9A4;
  --ok:#1B7F4B; --ok-bg:#E7F6EC; --info:#2D5FA8; --info-bg:#E8F0FB;
  --warn:#8A6D1F; --warn-bg:#FBF3E0; --danger:#B3261E; --danger-bg:#FCECEC;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 4px 16px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--t1); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 64px}
a{color:inherit;text-decoration:none}

/* ---------- 顶栏 ---------- */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.top-in{max-width:1320px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--t3)}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--t2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.dot.stale{background:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--line-soft);padding:3px;border-radius:8px}
.tab{padding:6px 16px;border-radius:6px;font-size:13px;color:var(--t2);cursor:pointer;border:none;background:none;font-weight:500}
.tab.on{background:var(--card);color:var(--t1);box-shadow:var(--shadow);font-weight:600}

/* ---------- 筛选区 ---------- */
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:20px 0 18px;box-shadow:var(--shadow)}
.frow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.fgroup{display:flex;gap:8px;align-items:flex-start}
.flabel{font-size:12px;color:var(--t3);white-space:nowrap;padding-top:5px;min-width:56px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 11px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;color:var(--t2);cursor:pointer;background:var(--card);transition:all .12s;white-space:nowrap}
.chip:hover{border-color:#C8CFD8;background:#FAFBFC}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#8A4B00;font-weight:600}
.chip .n{opacity:.55;margin-left:4px;font-size:11px}
.search{position:relative;flex:1;min-width:240px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#FCFDFD;outline:none;font-family:inherit}
.search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.08)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
select.sel{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--card);color:var(--t2);outline:none;font-family:inherit;cursor:pointer}
.fbar{display:flex;gap:12px;align-items:center;padding-top:14px;margin-top:14px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.btn{padding:6px 13px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--card);cursor:pointer;color:var(--t2);font-family:inherit}
.btn:hover{border-color:#C8CFD8;background:#FAFBFC;color:var(--t1)}
.btn.primary{background:var(--t1);color:#fff;border-color:var(--t1)}
.btn.primary:hover{background:#2A3138}
.rescount{font-size:12.5px;color:var(--t3);margin-left:auto}
.rescount b{color:var(--t1);font-size:14px}

/* ---------- 汇总视图 ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--t3);margin-bottom:6px}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:500;color:var(--t3);margin-left:3px}
.kpi .s{font-size:11.5px;color:var(--t3);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 18px;box-shadow:var(--shadow)}
.panel h3{font-size:13.5px;font-weight:650;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.panel .sub{font-size:11.5px;color:var(--t3);margin-bottom:14px}
canvas{display:block;width:100%}

/* 分类横条 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:112px 1fr 62px;align-items:center;gap:11px;cursor:pointer}
.bar:hover .bname{color:var(--accent)}
.bname{font-size:12.5px;color:var(--t2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .12s}
.bar.on .bname{font-weight:700;color:var(--t1)}
.btrack{height:20px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.bfill{height:100%;border-radius:4px;transition:width .35s cubic-bezier(.4,0,.2,1);min-width:2px}
.bval{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums}
.bval b{font-size:13.5px;color:var(--t1);font-weight:650}
.bval i{font-style:normal;color:var(--t3);font-size:11px;margin-left:4px}

/* 等级图例 */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lg b{font-variant-numeric:tabular-nums}

/* ---------- 明细列表 ---------- */
.plist{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
.pcard:hover{box-shadow:var(--shadow-lg);border-color:#D5DBE2}
.phead{display:flex;gap:12px;align-items:flex-start}
.ptitle{font-size:15px;font-weight:650;line-height:1.45;flex:1;letter-spacing:-.1px}
.ptitle a{border-bottom:1px solid transparent}
.ptitle a:hover{color:var(--accent);border-bottom-color:var(--accent-line)}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:9px 0 11px;font-size:12px;color:var(--t2)}
.pmeta .sep{color:var(--line);font-size:10px}
.tag{padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag.cat{background:var(--line-soft);color:var(--t2)}
.tag.lvA{background:var(--ok-bg);color:var(--ok);font-weight:600}
.tag.lvB{background:var(--info-bg);color:var(--info);font-weight:600}
.tag.lvC{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tag.lvD{background:var(--danger-bg);color:var(--danger);font-weight:600}
.tag.lvl{background:#F1F3F5;color:var(--t3)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.psum{font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:11px}
.phr{background:var(--accent-soft);border-left:2.5px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:#7A4A00;margin-bottom:12px}
.phr b{color:#8A4B00}
.pfoot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--line-soft)}
.pfoot .src{margin-left:auto;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.btn-sm{padding:4px 11px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--card);cursor:pointer;color:var(--t2);font-family:inherit;transition:all .12s}
.btn-sm:hover{border-color:#C8CFD8;background:#FAFBFC;color:var(--t1)}
.btn-sm.go{background:var(--t1);color:#fff;border-color:var(--t1)}
.btn-sm.go:hover{background:#2A3138}
.btn-sm.act{border-color:var(--accent-line);background:var(--accent-soft);color:#8A4B00}
.rel{margin-top:10px;padding:9px 12px;background:#FAFBFC;border:1px solid var(--line-soft);border-radius:7px;font-size:12px;display:none}
.rel.open{display:block}
.rel .rt{font-size:11.5px;color:var(--t3);margin-bottom:6px;font-weight:600}
.rel a{display:block;color:var(--info);margin:3px 0;word-break:break-all;font-size:11.5px;line-height:1.55}
.rel a:hover{text-decoration:underline}
.rel .rl{display:inline-block;min-width:15px;font-weight:700}
.more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--t2);display:none;line-height:1.75}
.more.open{display:block}
.more .ml{color:var(--t3);font-size:11.5px;display:inline-block;min-width:62px;font-weight:600}
.more .tg{display:inline-block;padding:1px 7px;background:var(--line-soft);border-radius:3px;font-size:11px;color:var(--t2);margin:2px 4px 2px 0}
.empty{text-align:center;padding:72px 20px;color:var(--t3)}
.empty h3{font-size:15px;color:var(--t2);margin-bottom:7px;font-weight:600}
.empty p{font-size:13px}
.footnote{text-align:center;font-size:12px;color:var(--t3);margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
mark{background:#FFE9A8;color:inherit;padding:0 1px;border-radius:2px}
.tag.sevH{background:var(--danger-bg);color:var(--danger);font-weight:600}
.tag.sevM{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tag.sevL{background:#EEF0F2;color:var(--t3);font-weight:600}
.tag.rel-tag{background:var(--accent-soft);color:#8A4B00;font-weight:600;border:1px solid var(--accent-line)}
.relsec,.finsec{margin-top:10px}
.relrow{margin:3px 0;font-size:12.5px;line-height:1.6}
.relname{color:var(--info);cursor:pointer}
.relname:hover{text-decoration:underline}
.relnote{color:var(--t3);font-size:11.5px}
.axis{margin-top:10px}
.axblock{background:#FAFBFC;border:1px solid var(--line-soft);border-radius:7px;padding:9px 12px;margin-top:7px}
.axblock>b{font-size:12.5px}
.axlbl{font-size:11px;color:var(--t3);margin:6px 0 2px;font-weight:600}
.axsum{font-size:12.5px;color:var(--t2);margin:4px 0}
.relist{margin:0 0 0 18px;padding:0}
.relist li{font-size:12.5px;color:var(--t2);line-height:1.65}
.finrow{background:#FAFBFC;border:1px solid var(--line-soft);border-radius:7px;padding:9px 12px;margin-top:7px;font-size:12.5px}
.finco{font-size:13px}
.fintag{display:inline-block;margin-left:6px;padding:1px 8px;background:var(--line-soft);border-radius:12px;font-size:11.5px;color:var(--t2)}
.finmeta{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.6}
.finmeta a{color:var(--info)}
/* ---------- 问答面板 ---------- */
.qa-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);max-width:920px;margin:0 auto}
.qa-desc{font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:14px;background:var(--accent-soft);border-left:2.5px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0}
.qa-in{display:flex;gap:10px;align-items:stretch}
.qa-in textarea{flex:1;min-height:64px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.6}
.qa-in textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,6,.08)}
.qa-in .btn.primary{align-self:flex-end}
.qa-res{margin-top:16px}
.qa-hint{font-size:13px;color:var(--t3);margin-bottom:12px}
.qa-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
.qa-i-head{display:flex;align-items:flex-start;gap:8px}
.qa-rank{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--accent);color:#fff;border-radius:5px;font-size:12px;font-weight:700;flex:none}
.qa-title{font-size:14px;font-weight:600;line-height:1.45;color:var(--t1)}
.qa-title:hover{color:var(--accent)}
.qa-i-meta{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.qa-m{font-size:12px;color:var(--t2)}
.qa-i-chunk{font-size:12.5px;color:var(--t2);line-height:1.75;background:#FAFBFC;border:1px solid var(--line-soft);border-radius:6px;padding:8px 11px;margin:4px 0}
.qa-src{font-size:12px;color:var(--info)}
.qa-actions{margin-top:14px}
.qa-set{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qa-inp{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;outline:none;min-width:260px;flex:1}
.qa-inp:focus{border-color:var(--accent)}
.qa-ai{white-space:pre-wrap;line-height:1.8;font-size:13px;color:var(--t1)}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:640px){.wrap,.top-in{padding-left:14px;padding-right:14px}.kpis{grid-template-columns:1fr 1fr}.bar{grid-template-columns:88px 1fr 54px}.qa-in{flex-direction:column}}
/* ---------- 报告视图（按政策监测报告支柱分组）---------- */
.sec-h{font-size:16px;font-weight:700;margin:24px 0 12px;padding-left:11px;border-left:4px solid var(--accent);letter-spacing:-.2px;display:flex;align-items:baseline;gap:10px}
.sec-h .n{font-size:12px;font-weight:500;color:var(--t3)}
.sec-h .desc{font-size:12px;font-weight:400;color:var(--t3);margin-left:auto}
.modbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.modbox h4{font-size:14.5px;font-weight:680;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.modbox .sub{font-size:12px;color:var(--t3);margin-bottom:12px}
.kwn{display:inline-block;padding:3px 11px;border-radius:13px;background:var(--accent-soft);color:#8A4B00;font-size:12.5px;font-weight:600;margin:3px 6px 3px 0}
.mini{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.mini a{font-size:12.5px;color:var(--info);line-height:1.5}
.mini .m-meta{font-size:11.5px;color:var(--t3);margin-left:6px}
.act-list{counter-reset:al;list-style:none;padding:0;margin:6px 0 0}
.act-list li{counter-increment:al;position:relative;padding:7px 0 7px 30px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--t2);line-height:1.65}
.act-list li:before{content:counter(al);position:absolute;left:0;top:7px;width:20px;height:20px;background:var(--accent);color:#fff;border-radius:5px;font-size:11px;font-weight:700;text-align:center;line-height:20px}
.act-list li b{color:var(--t1)}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--line-soft);color:var(--t2);margin:2px 4px 2px 0}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.act{background:var(--accent-soft);color:#8A4B00;border:1px solid var(--accent-line)}
.note-infer{font-size:11.5px;color:var(--t3);font-style:italic;margin-top:6px}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="boardTitle">政策动态看板</h1>
      <span id="boardSub">中国宏观经济与人力资源政策监测</span>
    </div>
    <div class="tabs">
      <button class="tab on" data-view="overview">汇总视图</button>
      <button class="tab" data-view="report">报告视图</button>
      <button class="tab" data-view="detail">明细列表</button>
      <button class="tab" data-view="impact">影响与行动</button>
      <button class="tab" data-view="qa">政策问答</button>
    </div>
    <div class="top-meta">
      <span id="stale"></span>
      <span id="updated"></span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="filters">
    <div class="frow">
      <div class="fgroup" style="flex:1 1 100%">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="kw" type="text" placeholder="搜索政策标题、摘要、发布机构、标签…">
        </div>
      </div>
    </div>
    <div class="frow" style="margin-top:12px">
      <div class="fgroup" style="flex:1 1 100%">
        <div class="flabel">政策主题</div>
        <div class="chips" id="fCategory"></div>
      </div>
    </div>
    <div class="frow" style="margin-top:12px">
      <div class="fgroup">
        <div class="flabel">时间范围</div>
        <div class="chips" id="fRange"></div>
      </div>
      <div class="fgroup">
        <div class="flabel">自定义</div>
        <select class="sel" id="fFrom"></select>
        <span style="color:var(--t3);padding-top:6px">至</span>
        <select class="sel" id="fTo"></select>
      </div>
    </div>
    <div class="frow" style="margin-top:12px">
      <div class="fgroup" style="flex:1 1 100%">
        <div class="flabel">发布机构</div>
        <div class="chips" id="fAgency"></div>
      </div>
    </div>
    <div class="fbar">
      <div class="fgroup">
        <div class="flabel" style="min-width:auto">来源等级</div>
        <div class="chips" id="fLevel"></div>
      </div>
      <div class="fgroup">
        <div class="flabel" style="min-width:auto">机构层级</div>
        <div class="chips" id="fAgencyLevel"></div>
      </div>
      <button class="btn" id="share">复制看板链接</button>
      <button class="btn" id="dlSnapshot">下载看板快照</button>
      <button class="btn" id="reset">重置筛选</button>
      <span class="rescount">命中 <b id="cnt">0</b> 条政策</span>
    </div>
  </div>

  <div id="viewOverview"></div>
  <div id="viewReport" style="display:none"></div>
  <div id="viewDetail" style="display:none"></div>
  <div id="viewImpact" style="display:none"></div>
  <div id="viewQa" style="display:none"></div>

  <div class="footnote" id="foot"></div>
</div>

// ---------- 工具 ----------
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function hl(s,q){
  s = esc(s);
  if(!q) return s;
  try{ return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }
  catch(e){ return s; }
}
function fmtDate(d,p){
  if(!d) return '日期待确认';
  return p==='month' ? d.slice(0,7).replace('-','年')+'月' : d;
}
function badge(it){
  var v=it.verification||{}, L=SL[v.level]||{};
  var cls = v.status==='pending' ? 'lvC' : 'lv'+v.level;
  var txt = v.status==='pending' ? '待核验' : (L.badge||v.level);
  return '<span class="tag '+cls+'" title="'+esc(v.reason||'')+'">'+esc(txt)+'</span>';
}

// ---------- 筛选 ----------
function inPeriod(it){
  if(!S.from && !S.to) return true;
  var p = it.period||'';
  if(S.from && p < S.from) return false;
  if(S.to && p > S.to) return false;
  return true;
}
function matchKw(it,q){
  if(!q) return true;
  q = q.toLowerCase();
  var hay = [it.title,it.summary,it.agencyPrimary,it.subCategory,(it.tags||[]).join(' '),(it.agencies||[]).join(' ')].join(' ').toLowerCase();
  if(hay.indexOf(q)>=0) return true;
  // 多关键词（空格分隔）需全部命中
  return q.split(/\s+/).filter(Boolean).every(function(t){return hay.indexOf(t)>=0;});
}
// except：跳过某个维度，用于计算该维度各选项的「可选数量」（faceted search 惯例）
function matchAll(it, except, q){
  if(except!=='category' && S.category.length && S.category.indexOf(it.category)<0) return false;
  if(except!=='agency' && S.agency.length && S.agency.indexOf(it.agencyPrimary)<0) return false;
  if(except!=='agencyLevel' && S.agencyLevel.length && S.agencyLevel.indexOf(it.agencyLevel)<0) return false;
  if(except!=='level' && S.level.length && S.level.indexOf((it.verification||{}).level)<0) return false;
  if(except!=='period' && !inPeriod(it)) return false;
  if(except!=='kw' && !matchKw(it,q)) return false;
  return true;
}
function filtered(){
  return items.filter(function(it){ return matchAll(it,null,S.kw.trim()); });
}
function facetCount(except, getVal){
  var q=S.kw.trim(), m={};
  items.forEach(function(it){
    if(!matchAll(it,except,q)) return;
    var v=getVal(it); if(v) m[v]=(m[v]||0)+1;
  });
  return m;
}

// ---------- 图表 ----------
function setupCanvas(cv,h){
  var dpr = window.devicePixelRatio||1, w = cv.parentNode.clientWidth-36;
  cv.style.height = h+'px';
  cv.width = w*dpr; cv.height = h*dpr;
  var x = cv.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,w,h);
  return {x:x,w:w,h:h};
}
function drawTrend(cv, rows){
  var c = setupCanvas(cv, 216), x=c.x, W=c.w, H=c.h;
  var pad = {l:34,r:8,t:14,b:26};
  var pw = W-pad.l-pad.r, ph = H-pad.t-pad.b;
  if(!rows.length){ x.fillStyle='#8A94A2'; x.font='12px sans-serif'; x.textAlign='center'; x.fillText('当前筛选无数据', W/2, H/2); return; }
  var max = Math.max.apply(null, rows.map(function(r){return r.total;}));
  max = Math.max(max, 1);
  var ticks = Math.min(4, Math.max(1, max));
  // 网格
  x.strokeStyle='#EFF1F4'; x.lineWidth=1; x.fillStyle='#8A94A2'; x.font='10.5px sans-serif'; x.textAlign='right';
  for(var i=0;i<=ticks;i++){
    var yy = pad.t + ph - (ph/ticks)*i;
    x.beginPath(); x.moveTo(pad.l, yy+.5); x.lineTo(W-pad.r, yy+.5); x.stroke();
    x.fillText(Math.round(max/ticks*i), pad.l-6, yy+3.5);
  }
  var bw = pw/rows.length, gap = Math.min(16, bw*0.34);
  rows.forEach(function(r,i){
    var bh = Math.max(2, (r.total/max)*ph);
    var bx = pad.l + bw*i + gap/2, by = pad.t+ph-bh;
    // 按分类堆叠
    var acc = 0, keys = Object.keys(r.byCategory||{});
    keys.forEach(function(k){
      var seg = ((r.byCategory[k]/r.total)*(ph*(r.total/max)));
      x.fillStyle = (CAT[k]&&CAT[k].color)||'#94A3B8';
      x.fillRect(bx, pad.t+ph-(ph*(r.total/max))+acc, bw-gap, Math.max(0,seg-0.5));
      acc += seg;
    });
    x.fillStyle='#4B5563'; x.font='10px sans-serif'; x.textAlign='center';
    x.fillText(r.period.slice(2).replace('-','/'), bx+(bw-gap)/2, H-9);
    if(bw>38){ x.fillStyle='#151A20'; x.font='600 10.5px sans-serif'; x.fillText(r.total, bx+(bw-gap)/2, by-4); }
  });
}
function drawDonut(cv, data){
  var c = setupCanvas(cv, 196), x=c.x, W=c.w, H=c.h;
  var total = data.reduce(function(a,b){return a+b.n;},0);
  var cx=W/2, cy=H/2, r=Math.min(W,H)/2-14, ir=r*0.62;
  if(!total){ x.fillStyle='#8A94A2'; x.font='12px sans-serif'; x.textAlign='center'; x.fillText('无数据',cx,cy); return; }
  var a0=-Math.PI/2;
  data.forEach(function(d){
    if(!d.n) return;
    var a1 = a0 + (d.n/total)*Math.PI*2;
    x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,r,a0,a1); x.closePath();
    x.fillStyle=d.color; x.fill();
    a0=a1;
  });
  x.globalCompositeOperation='destination-out';
  x.beginPath(); x.arc(cx,cy,ir,0,Math.PI*2); x.fill();
  x.globalCompositeOperation='source-over';
  x.fillStyle='#151A20'; x.font='700 22px sans-serif'; x.textAlign='center';
  x.fillText(total, cx, cy+3);
  x.fillStyle='#8A94A2'; x.font='11px sans-serif';
  x.fillText('条已核验来源', cx, cy+20);
}

function sevTag(sev){

// ---------- 政策问答（基于 qaChunks 的轻量关键词检索）----------
// 说明：浏览器内无 LLM key，故采用「检索依据片段 + 提示 + 复制上下文」方式，保证回答基于最新看板内容、附来源。
// 如需真正的生成式问答，可在此处增加一个 fetch 调用（配置化的 endpoint/key），把下面 scored 结果作为 context 传入后端 LLM。
function tokenize(s){ return String(s||'').toLowerCase().split(/\s+/).filter(function(t){return t.length>0;}); }
function corpusOf(it){
  var chunks = it.qaChunks && it.qaChunks.length ? it.qaChunks : null;
  if(chunks) return chunks.join('\n');
  var imp = it.impact && typeof it.impact==='object' ? (it.impact.summary||'') : (it.impact||'');
  return [it.title, it.summary, imp, (it.tags||[]).join(' '), (it.agencies||[]).join(' ')].join('\n');
}
// ---------- 政策问答（P5：检索 + 可选生成式）----------
// 说明：浏览器内先做关键词检索取 Top-K 依据；若界面内配置了 LLM（OpenAI 兼容
// endpoint/apiKey/model，存 localStorage），可选「生成式回答」把检索到的依据作为
// context 传给后端 LLM 生成回答并附引用，保证基于最新看板内容、不编造。
function loadQaLlm(){ try{ return JSON.parse(localStorage.getItem('policyQaLlm')||'null'); }catch(e){ return null; } }
function renderQa(){
  var box=document.getElementById('viewQa');
  if(box.dataset.built) return; // 仅构建一次 UI，事件绑定一次
  box.dataset.built='1';
  var llm = loadQaLlm() || {};
  box.innerHTML = '<div class="qa-panel">'+
    '<div class="qa-desc">输入关于政策的问题，系统在当前筛选范围内检索最相关政策并展示依据片段（来自 qaChunks）。配置 LLM 后可一键生成式回答并附引用。</div>'+
    '<div class="qa-set"><button class="btn-sm" id="qaSetToggle">LLM 设置'+(llm.baseURL?' ✓':'')+'</button>'+
      '<span class="qa-m" style="margin-left:8px">模式：</span>'+
      '<select class="sel" id="qaMode">'+
        '<option value="retrieve"'+((llm.mode||'retrieve')==='retrieve'?' selected':'')+'>仅检索</option>'+
        '<option value="generate"'+((llm.mode||'retrieve')==='generate'?' selected':'')+'>生成式回答</option>'+
      '</select></div>'+
    '<div class="qa-setcfg" id="qaSetCfg" style="display:none;margin-top:10px;padding:10px 12px;background:#FAFBFC;border:1px solid var(--line-soft);border-radius:7px">'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<input id="qaBase" class="qa-inp" placeholder="baseURL（如 https://.../v1/chat/completions）" value="'+esc(llm.baseURL||'')+'">'+
        '<input id="qaKey" class="qa-inp" type="password" placeholder="apiKey" value="'+esc(llm.apiKey||'')+'">'+
        '<input id="qaModel" class="qa-inp" style="min-width:120px;flex:none" placeholder="model" value="'+esc(llm.model||'')+'">'+
        '<button class="btn primary" id="qaSave">保存</button>'+
      '</div>'+
      '<div class="qa-m" style="margin-top:6px">保存后选「生成式回答」即可基于看板内容生成回答。配置仅存本机浏览器（localStorage），不上传。</div>'+
    '</div>'+
    '<div class="qa-in" style="margin-top:12px"><textarea id="qaInput" rows="3" placeholder="输入关于政策的问题，例如：某政策对猎聘有什么影响？"></textarea>'+
      '<button class="btn primary" id="qaRun">检索并解答</button></div>'+
    '<div id="qaRes" class="qa-res"></div></div>';
  document.getElementById('qaSetToggle').addEventListener('click', function(){
    var cfg=document.getElementById('qaSetCfg'); cfg.style.display = cfg.style.display==='none'?'':'none';
  });
  document.getElementById('qaSave').addEventListener('click', function(){
    var o=loadQaLlm()||{};
    o.baseURL=document.getElementById('qaBase').value.trim();
    o.apiKey=document.getElementById('qaKey').value.trim();
    o.model=document.getElementById('qaModel').value.trim();
    o.mode=document.getElementById('qaMode').value;
    localStorage.setItem('policyQaLlm', JSON.stringify(o));
    document.getElementById('qaSetToggle').textContent='LLM 设置 ✓';
    this.textContent='已保存'; var b=this; setTimeout(function(){b.textContent='保存';},1400);
  });
  document.getElementById('qaMode').addEventListener('change', function(){
    var o=loadQaLlm()||{}; o.mode=this.value; localStorage.setItem('policyQaLlm', JSON.stringify(o));
  });
  document.getElementById('qaRun').addEventListener('click', runQa);
  document.getElementById('qaInput').addEventListener('keydown', function(e){ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') runQa(); });
}
function runQa(){
  var q = document.getElementById('qaInput').value.trim();
  var res = document.getElementById('qaRes');
  if(!q){ res.innerHTML='<div class="qa-hint">请输入问题。</div>'; return; }
  var toks = tokenize(q);
  var scope = filtered(); // 问答同样受当前筛选约束
  var scored = scope.map(function(it){
    var corpus = corpusOf(it).toLowerCase();
    var hit=[];
    toks.forEach(function(t){ if(corpus.indexOf(t)>=0) hit.push(t); });
    var score = hit.length;
    if(toks.length && hit.length===toks.length) score += 2; // 全部命中加权
    return {it:it, score:score, hit:hit};
  }).filter(function(x){return x.score>0;})
    .sort(function(a,b){return b.score-a.score;}).slice(0,5);
  if(!scored.length){ res.innerHTML='<div class="qa-hint">当前筛选范围内未检索到相关依据。试试放宽筛选或更换关键词。</div>'; return; }

  var ctx = scored.map(function(x,i){
    var it=x.it;
    var chunk = (it.qaChunks&&it.qaChunks.filter(function(c){return c && x.hit.some(function(t){return c.toLowerCase().indexOf(t)>=0;});})[0]) || it.summary || it.title;
    return '【依据 '+(i+1)+'】'+it.title+'（'+(it.agencyPrimary||'')+'，'+fmtDate(it.publishDate,it.datePrecision)+'，来源等级 '+(it.verification||{}).level+'）\n链接：'+it.sourceUrl+'\n片段：'+chunk;
  }).join('\n\n');

  var llm = loadQaLlm();
  var useGen = llm && llm.mode==='generate' && llm.baseURL && llm.apiKey && llm.model;

  if(useGen){
    res.innerHTML='<div class="qa-hint">正在基于 '+scored.length+' 条看板依据生成回答…</div>';
    generateAnswer(q, ctx).then(function(ans){
      var html='<div class="qa-item" style="border-color:var(--accent)"><div class="qa-i-head"><span class="qa-rank">AI</span> <span class="qa-title">生成式回答</span></div>'+
        '<div class="qa-ai">'+esc(ans)+'</div>'+
        '<div class="axlbl" style="margin-top:10px">引用依据（'+scored.length+' 条，来自看板）</div>';
      scored.forEach(function(x,i){ var it=x.it;
        html+='<div class="qa-item" style="margin:6px 0;padding:9px 11px"><div class="qa-i-head"><span class="qa-rank">'+(i+1)+'</span> <a class="qa-title" href="'+esc(it.sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+hl(it.title,q)+'</a></div>'+
          '<div class="qa-i-meta">'+badge(it)+' <span class="qa-m">'+esc(it.agencyPrimary||'')+'</span> <span class="qa-m">'+esc(fmtDate(it.publishDate,it.datePrecision))+'</span></div></div>';
      });
      html+='</div><div class="qa-actions"><button class="btn" id="qaCopy">复制上下文去问 AI 助手</button></div>';
      res.innerHTML=html; bindCopy(res, q, ctx);
    }).catch(function(err){
      res.innerHTML='<div class="qa-hint">生成式回答失败（'+esc(err.message||err)+'），已回退检索模式：</div>'+retrieveHtml(q, scored);
      bindCopy(res, q, ctx);
    });
    return;
  }
  res.innerHTML = retrieveHtml(q, scored);
  bindCopy(res, q, ctx);
}
function retrieveHtml(q, scored){
  var html='<div class="qa-hint">以下是看板中最相关的内容，可作为回答依据（命中 '+scored.length+' 条）：</div>';
  scored.forEach(function(x,i){
    var it=x.it;
    var chunk = (it.qaChunks&&it.qaChunks.filter(function(c){return c && x.hit.some(function(t){return c.toLowerCase().indexOf(t)>=0;});})[0]) || it.summary || it.title;
    html += '<div class="qa-item">'+
      '<div class="qa-i-head"><span class="qa-rank">'+(i+1)+'</span> <a class="qa-title" href="'+esc(it.sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+hl(it.title,q)+'</a></div>'+
      '<div class="qa-i-meta">'+badge(it)+' <span class="qa-m">'+esc(it.agencyPrimary||'')+'</span> <span class="qa-m">'+esc(fmtDate(it.publishDate,it.datePrecision))+'</span></div>'+
      '<div class="qa-i-chunk">'+hl(chunk,q)+'</div>'+
      '<a class="qa-src" href="'+esc(it.sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>'+
      '</div>';
  });
  return html;
}
function bindCopy(res, q, ctx){
  var btn=res.querySelector('#qaCopy');
  if(!btn) return;
  btn.addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText('问题：'+q+'\n\n'+ctx);
    this.textContent='已复制'; var b=this; setTimeout(function(){b.textContent='复制上下文去问 AI 助手';},1400);
  });
}
function generateAnswer(q, ctx){
  var llm=loadQaLlm();
  var system='你是政策分析助手，仅基于下面提供的「看板资料」回答问题，不得编造资料外信息；如资料不足以回答，请明确说明。回答末尾用中文列出引用的政策名称。';
  var user='用户问题：'+q+'\n\n===== 看板资料 =====\n'+ctx+'\n===== 结束 =====';
  return fetch(llm.baseURL, {
    method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer '+llm.apiKey},
    body: JSON.stringify({ model:llm.model, temperature:0.2, messages:[{role:'system',content:system},{role:'user',content:user}] })
  }).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){ var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content; if(!c) throw new Error('空回答'); return c; });
}

// ---------- 交互 ----------
function render(){
  var list = filtered();
  document.getElementById('cnt').textContent = list.length;
  renderFilterBar();
  if(S.view==='overview'){ renderOverview(list); }
  else if(S.view==='detail'){ renderDetail(list); }
  else if(S.view==='report'){ renderReport(list); }
  document.getElementById('viewOverview').style.display = S.view==='overview'?'':'none';
  document.getElementById('viewReport').style.display = S.view==='report'?'':'none';
  document.getElementById('viewDetail').style.display = S.view==='detail'?'':'none';
  document.getElementById('viewImpact').style.display = S.view==='impact'?'':'none';
  if(S.view==='impact'){ renderImpact(); }
}
function toggle(arr,v){ var i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-k]');
  if(t){
    var k=t.getAttribute('data-k'), v=t.getAttribute('data-v');
    if(k==='range'){
      if(/^\d{4}-\d{2}$/.test(v)){ S.from=v; S.to=v; S.range=0; }
      else { S.range = (v==='all'||v==='yearToDate')?(v==='all'?0:periods.length):parseInt(v,10); applyRange(S.range); }
    }
    else if(k==='category') toggle(S.category,v);
    else if(k==='agency') toggle(S.agency,v);
    else if(k==='level') toggle(S.level,v);
    else if(k==='agencyLevel') toggle(S.agencyLevel,v);
    render(); return;
  }
  var tab = e.target.closest('.tab');
  if(tab){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    tab.classList.add('on');
    var view = tab.getAttribute('data-view');
    if(view==='qa'){
      // 问答视图独立于 overview/detail，受当前筛选约束
      document.getElementById('viewOverview').style.display='none';
      document.getElementById('viewDetail').style.display='none';
      document.getElementById('viewImpact').style.display='none';
      document.getElementById('viewQa').style.display='';
      renderQa();
    } else if(view==='impact'){
      S.view='impact';
      document.getElementById('viewOverview').style.display='none';
      document.getElementById('viewDetail').style.display='none';
      document.getElementById('viewQa').style.display='none';
      render();
    } else {
      S.view = view;
      document.getElementById('viewQa').style.display='none';
      render();
    }
    return;
  }
  // 演进关系跳转：点击目标政策标题，切到明细列表并展开对应卡片
  var jp = e.target.closest('[data-jump]');
  if(jp){
    var tid = jp.getAttribute('data-jump');
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on', x.getAttribute('data-view')==='detail');});
    S.view='detail'; document.getElementById('viewQa').style.display='none';
    document.getElementById('viewOverview').style.display='none';
    document.getElementById('viewDetail').style.display='';
    render();
    var tc = document.querySelector('.pcard[data-id="'+CSS.escape(tid)+'"]');
    if(tc){ tc.scrollIntoView({behavior:'smooth',block:'center'}); var m=tc.querySelector('.more'); if(m && !m.classList.contains('open')){ m.classList.add('open'); } }
    return;
  }
  var b = e.target.closest('[data-act]');
  if(b){
    var card = b.closest('.pcard'), act = b.getAttribute('data-act');
    if(act==='rel'){ card.querySelector('.rel').classList.toggle('open'); }
    if(act==='more'){ var m=card.querySelector('.more'); m.classList.toggle('open'); b.textContent = m.classList.contains('open')?'收起详情':'展开详情'; b.classList.toggle('act'); }
    if(act==='copy'){
      var id = card.getAttribute('data-id');
      var it = items.filter(function(x){return x.id===id;})[0];
      if(it){
        var txt = it.title+(it.docNumber?'（'+it.docNumber+'）':'')+'／'+it.agencyPrimary+'，'+it.publishDate+'。'+it.sourceUrl;
        if(navigator.clipboard) navigator.clipboard.writeText(txt);
        b.textContent='已复制'; setTimeout(function(){b.textContent='复制引用';},1400);
      }
    }
    return;
  }
  var rs = e.target.closest('#reset');
  if(rs){ S.category=[];S.agency=[];S.agencyLevel=[];S.kw='';S.range=12;S.level=['A','B'];applyRange(12);document.getElementById('kw').value='';render(); }
});
document.getElementById('share').addEventListener('click', function(){
  if(navigator.clipboard) navigator.clipboard.writeText(location.href);
  this.textContent='已复制'; var btn=this; setTimeout(function(){btn.textContent='复制看板链接';},1400);
});
document.getElementById('dlSnapshot').addEventListener('click', function(){
  var md = buildSnapshotMd();
  var blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='政策情报看板_'+((D.meta&&D.meta.generatedAt)||'').slice(0,10)+'.md';
  document.body.appendChild(a); a.click(); a.remove();
  this.textContent='已下载'; var btn=this; setTimeout(function(){btn.textContent='下载看板快照';},1400);
});
// 浏览器内离线生成看板快照 Markdown（与 scripts/snapshot.mjs 同源逻辑）
function buildSnapshotMd(){
  var lines=[]; var meta=D.meta||{}; var items=(D.items||[]).slice().sort(function(a,b){return String(b.publishDate||'').localeCompare(String(a.publishDate||''));});
  lines.push('# 政策情报看板 · 快照'); lines.push('');
  lines.push('> 生成时间：'+((meta.generatedAt||'').slice(0,19).replace('T',' ')||new Date().toISOString().slice(0,19))); lines.push('');
  var c=meta.counts||{}, k=meta.kpi||{};
  lines.push('## 一、核心指标'); lines.push('');
  lines.push('- 政策总数：**'+(k.total??c.published??0)+'** 条（本月新增 '+(k.thisMonth??'-')+' 条）');
  lines.push('- 已核验占比：**'+(k.verifiedRate??'-')+'%** ｜ 去重合并 '+(c.merged??0)+' 条 ｜ 隔离 '+(c.quarantined??0)+' 条');
  lines.push('- 政策关系 '+ (meta.relationshipsCount??0) +' 条 ｜ 投融资 '+(meta.financingsCount??0)+' 条 ｜ 影响待审签 '+(meta.impactPending??0)+' 条'); lines.push('');
  var facets=D.facets||{};
  lines.push('## 二、按分类分布'); lines.push('');
  if(Object.keys(facets.category||{}).length){ lines.push('| 分类 | 条数 |'); lines.push('|---|---|'); Object.entries(facets.category).sort(function(a,b){return b[1]-a[1];}).forEach(function(e){ lines.push('| '+(CATNAME[e[0]]||e[0])+' | '+e[1]+' |'); }); }
  lines.push(''); lines.push('## 三、最新政策（Top 15）'); lines.push(''); lines.push('| 发布日期 | 机构 | 分类 | 政策 | 概要 |'); lines.push('|---|---|---|---|---|');
  items.slice(0,15).forEach(function(it){ lines.push('| '+(it.publishDate||'-')+' | '+(it.agencyPrimary||'-')+' | '+(CATNAME[it.category]||it.category||'-')+' | '+(it.title||'').replace(/\|/g,'｜')+' | '+(it.summary||'').replace(/\|/g,'｜').slice(0,60)+' |'); });
  lines.push(''); lines.push('---'); lines.push('*本快照由政策情报看板离线生成。*');
  return lines.join('\n');
}
document.getElementById('kw').addEventListener('input', function(e){ S.kw = e.target.value; render(); });
document.getElementById('fFrom').addEventListener('change', function(e){ S.from=e.target.value; S.range=0; render(); });
document.getElementById('fTo').addEventListener('change', function(e){ S.to=e.target.value; S.range=0; render(); });
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(render,220); });

render();
})();
